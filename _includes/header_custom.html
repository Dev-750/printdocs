<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

<style>
  #theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.35rem;
    margin-left: 0.5rem;
    background: transparent;
    border: 0;
    cursor: pointer;
    color: inherit;
  }
  #theme-toggle .material-symbols-outlined {
    font-size: 24px;
    line-height: 1;
  }
</style>

<button id="theme-toggle" type="button" class="" aria-label="Toggle dark mode">
  <span class="material-symbols-outlined" aria-hidden="true">dark_mode</span>
</button>

<script>
(function () {
  var KEY = 'jtd-theme';
  var LIGHT = 'green-light';
  var DARK = 'green-dark';
  var btn = document.getElementById('theme-toggle');
  var icon = btn.querySelector('.material-symbols-outlined');

  function findLink() {
    var links = document.querySelectorAll('link[rel="stylesheet"]');
    for (var i = 0; i < links.length; i++) {
      var h = links[i].getAttribute('href') || '';
      if (/just-the-docs-(?!head-nav)[\w-]+\.css/.test(h)) return links[i];
    }
    return null;
  }

  function apply(theme) {
    var link = findLink();
    if (!link) {
      console.warn('Theme toggle: Just the Docs stylesheet link not found');
    } else {
      link.setAttribute('href',
        link.getAttribute('href').replace(/just-the-docs-(?!head-nav)[\w-]+\.css/, 'just-the-docs-' + theme + '.css'));
    }
    icon.textContent = theme === DARK ? 'light_mode' : 'dark_mode';
    btn.dataset.theme = theme;
  }

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved !== LIGHT && saved !== DARK) saved = null;

  var initial = saved ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? DARK : LIGHT);
  apply(initial);

  btn.addEventListener('click', function () {
    var next = btn.dataset.theme === DARK ? LIGHT : DARK;
    console.log('Switching to', next);
    apply(next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
  });
})();
</script>
